[project]
name = "vinyl-second-brain"
version = "0.1.0"
description = "Vinyl record library: Discogs intake, BPM/key analysis, audio, notes, labels"
requires-python = ">=3.11"
# Dependencies: ../requirements.txt (pinned: ../requirements.lock.txt), shared with bpmkey and audioresearch.

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
