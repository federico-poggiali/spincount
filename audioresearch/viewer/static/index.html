<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio research viewer</title>
<style>
  :root {
    --bg: #0c0c0d; --panel: #141416; --line: #26262a; --text: #e8e8ea; --dim: #8b8b93;
    --accent: #e5484d; --ok: #46a758; --warn: #e5a50a; --run: #5b9cf5;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 24px 64px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 16px; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); font-weight: 600; margin: 28px 0 10px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text] { flex: 1 1 360px; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 9px 12px; border-radius: 6px; font: 13px var(--mono); }
  input[type=text]:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 9px 14px; border-radius: 6px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .chk { display: flex; gap: 6px; align-items: center; color: var(--dim); cursor: pointer; } .chk input { accent-color: var(--accent); }
  .total { font: 13px var(--mono); color: var(--dim); margin-left: auto; }
  .release { margin-top: 14px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 48px; color: var(--dim); }
  .release b { color: var(--text); font-weight: 600; }
  .release .meta { font: 12px var(--mono); margin-top: 4px; }
  .level { display: grid; grid-template-columns: 150px 1fr 80px; gap: 12px; align-items: start; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-bottom: 8px; }
  .level.running { border-color: var(--run); } .level.skipped { opacity: .55; }
  .lname b { display: block; } .lname span { font-size: 12px; color: var(--dim); }
  .lms { text-align: right; font: 12px var(--mono); color: var(--dim); }
  .boxes { display: flex; flex-wrap: wrap; gap: 8px; }
  .abox { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 190px; background: #101012; }
  .abox .an { font: 12px var(--mono); margin-bottom: 4px; }
  .abox.off .an { color: var(--accent); }
  .stage { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 2px 0; }
  .stage .st { color: var(--dim); } .stage .cnt { font-family: var(--mono); }
  .s-waiting { color: var(--dim); } .s-running { color: var(--run); } .s-done { color: var(--ok); } .s-skipped { color: var(--dim); }
  .s-failed { color: var(--accent); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: currentColor; }
  .s-running .dot { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .s-running .dot { animation: none; } }
  table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; font-size: 12px; vertical-align: top; }
  th { color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
  td.pos { font-family: var(--mono); white-space: nowrap; } td.ttl { max-width: 260px; }
  .cell-found { color: var(--ok); } .cell-review { color: var(--warn); } .cell-notfound { color: var(--dim); } .cell-no { color: #4a4a50; }
  .cell small { display: block; margin-top: 2px; color: var(--dim); font-family: var(--mono); }
  #log { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-height: 360px; overflow: auto;
    font: 11.5px/1.6 var(--mono); }
  #log div.rej { color: var(--accent); } #log div.res { color: var(--ok); } #log div.off { color: var(--warn); }
  #log .t { color: var(--dim); display: inline-block; min-width: 64px; }
  .summary { display: flex; gap: 24px; flex-wrap: wrap; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .summary div b { display: block; font: 600 22px var(--mono); } .summary div span { color: var(--dim); font-size: 12px; }
  a { color: var(--run); text-decoration: none; word-break: break-all; } a:hover { text-decoration: underline; }
  td.lnk { font-family: var(--mono); max-width: 360px; } .alt { color: var(--dim); font-size: 11px; display: block; }
  .err { color: var(--accent); font: 12px var(--mono); white-space: pre-wrap; }
  /* Record view: mirrors Spin Count's record page (frontend/src/pages/RecordPage.module.css) */
  .rec { --ink: #eceef1; --ink-2: #a6adb8; --ink-3: #8b929d; --surface: #141518; --raise: #1b1d21;
    --hair: rgba(200,212,235,.07); --hair-2: rgba(200,212,235,.13); --signal-ink: #ff6b70;
    display: grid; gap: 18px; margin-top: 14px; padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: #0d0e10; }
  .rec[hidden] { display: none; }
  .rec .crumbs { display: flex; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink-3); }
  .rec .crumbs b { color: var(--ink-2); font-weight: 500; }
  .rec .head { display: grid; grid-template-columns: 88px minmax(0,1fr) auto; gap: 18px; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--hair); }
  .rec .cover { width: 88px; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--raise); box-shadow: 0 0 0 1px var(--hair), 0 12px 30px -10px rgba(0,4,12,.7); }
  .rec .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rec .cover.empty { display: flex; align-items: flex-end; justify-content: center; gap: 4px; padding-bottom: 28%; }
  .rec .cover.empty i { width: 12%; height: 22%; border-radius: 1px; background: var(--hair-2); }
  .rec .cover.empty i:nth-child(2) { height: 38%; background: var(--ink-3); }
  .rec h1 { margin: 0; font-size: clamp(24px, 3vw, 32px); line-height: 1.1; letter-spacing: -.02em; font-weight: 600; overflow-wrap: anywhere; }
  .rec .artist { margin: 6px 0 0; font-size: 15px; font-weight: 500; color: var(--ink-2); } .rec .artist span { color: var(--ink-3); }
  .rec .badge { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 500; color: var(--signal-ink); background: rgba(229,72,77,.12); border-radius: 7px; padding: 5px 8px; }
  .rec .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .rec .ghost { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--hair-2); border-radius: 10px; background: transparent;
    color: var(--ink); font: 500 13px var(--sans); text-decoration: none; word-break: normal; }
  .rec .ghost:hover { border-color: var(--ink); text-decoration: none; }
  .rec .primary { background: #d93036; border-color: #e5484d; color: #fff; }
  .rec .body { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 28px; align-items: start; }
  .rec .tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--hair); margin-bottom: 12px; }
  .rec .tabs span { position: relative; display: inline-flex; gap: 6px; align-items: center; height: 38px; font-weight: 500; font-size: 14px; }
  .rec .tabs span::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink); }
  .rec .tabs em { font: 600 11px var(--sans); font-style: normal; padding: 2px 6px; border-radius: 999px; background: var(--raise); color: var(--ink-2); }
  .rec table { background: none; border: 0; border-radius: 0; }
  .rec th { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 0 10px 10px; border: 0; }
  .rec td { padding: 12px 10px; border-top: 1px solid var(--hair); border-bottom: 0; vertical-align: middle; font-size: 14px; }
  .rec tr:hover td, .rec tr.now td { background: var(--surface); }
  .rec .tpos { color: var(--ink-3); font: 500 12px var(--mono); width: 3rem; }
  .rec .tname b { display: block; font-weight: 600; letter-spacing: -.01em; } .rec .tname span { color: var(--ink-2); font-size: 13px; }
  .rec tr.none .tname b { color: var(--ink-2); }
  .rec .len { color: var(--ink-3); font: 500 12px var(--mono); text-align: right; white-space: nowrap; }
  .rec .src { font: 500 11px/1 var(--mono); padding: 4px 7px; border-radius: 7px; background: var(--surface); color: var(--ink-2); white-space: nowrap; }
  .rec .src.rev { color: var(--signal-ink); }
  .rec .none-src { color: var(--ink-3); font: 500 12px var(--mono); }
  .rec .hint { margin: 10px 2px 0; color: var(--ink-3); font-size: 13px; }
  .rec aside { position: sticky; top: 20px; display: grid; gap: 14px; padding: 16px; border: 1px solid var(--hair); border-radius: 12px; background: var(--surface); }
  .rec aside h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; text-transform: none; }
  .rec dl { margin: 0; display: grid; }
  .rec .attr { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 10px; align-items: center; min-height: 34px; border-top: 1px solid var(--hair); }
  .rec .attr:first-child { border-top: 0; }
  .rec .attr dt { font-size: 13px; font-weight: 500; color: var(--ink-3); } .rec .attr dd { margin: 0; font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
  .rec .block { padding-top: 14px; border-top: 1px solid var(--hair); display: grid; gap: 8px; }
  .rec .block h3 { margin: 0; font-size: 13px; font-weight: 500; color: var(--ink-3); }
  .rec .famrow { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 500; }
  .rec .famrow span { color: var(--ink-3); font: 500 12px var(--mono); }
  .rec .stores { display: flex; flex-wrap: wrap; gap: 6px; }
  .rec .play { border-color: var(--hair-2); }
  @media (max-width: 1000px) { .rec .body { grid-template-columns: 1fr; } .rec aside { position: static; order: -1; } }
  @media (max-width: 640px) { .rec .head { grid-template-columns: 64px minmax(0,1fr); } .rec .cover { width: 64px; } .rec .actions { grid-column: 1 / -1; justify-content: flex-start; } }
  .play { width: 30px; height: 30px; padding: 0; border-radius: 50%; font-size: 12px; line-height: 1; }
  .play.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .find { display: inline-block; margin: 4px 4px 0 0; padding: 3px 8px; border: 1px solid var(--line); border-radius: 5px;
    font: 11px var(--mono); color: var(--text); white-space: nowrap; word-break: normal; }
  .find:hover { border-color: var(--accent); text-decoration: none; }
  .fam { font: 12px var(--mono); color: var(--dim); margin: 0 0 8px; }
  .fam b { color: var(--text); font-weight: 600; }
  #dock { position: fixed; right: 16px; bottom: 16px; width: 380px; max-width: calc(100vw - 32px); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #dock .dh { display: flex; justify-content: space-between; align-items: center; font: 12px var(--mono); color: var(--dim); margin-bottom: 8px; gap: 8px; }
  #dock .dh button { padding: 2px 8px; }
  #dock iframe { display: block; width: 100%; border: 0; }
</style>
</head>
<body>
<main>
  <h1>Audio research <span>/</span> process viewer</h1>
  <div class="bar">
    <input id="url" type="text" placeholder="https://www.discogs.com/release/…" aria-label="Discogs link" autocomplete="off">
    <label class="chk" title="Test mode: every level searches every track and the run never stops early (slower, more downloads)"><input type="checkbox" id="searchall"> Search all levels</label>
    <button id="start" class="primary">Start</button>
    <select id="past" aria-label="Past runs"><option value="">Past runs…</option></select>
    <div class="total" id="total">0.0 s</div>
  </div>
  <div class="release" id="release">No run yet. Paste a Discogs release link and press Start.</div>

  <section class="rec" id="record" hidden aria-label="Record with previews"></section>

  <h2>Levels</h2>
  <div id="levels"></div>

  <h2>Tracks by level</h2>
  <div id="grid"></div>

  <h2>Results and links</h2>
  <div id="results" class="release">Shown when the run finishes.</div>

  <h2>Summary</h2>
  <div id="summary" class="release">Shown when the run finishes.</div>

  <h2>Event log</h2>
  <div id="log" role="log"></div>
</main>
<div id="dock" hidden></div>
<script>
const LEVELS = [
  [0, "Your files", "local files, pasted links"], [1, "Discogs find", "YouTube, iTunes"], [2, "Bandcamp", ""],
  [3, "SoundCloud", "tracks, sets"], [5, "Record stores", "clips"],
];
const STORES = { deejay_de: "deejay.de", hardwax: "Hard Wax", redeye: "Redeye", decks_de: "Decks", clone: "Clone", soundmetaphors: "Sound Metaphors", one_eye_witness: "One Eye Witness", smallblackdots: "Small Black Dots", runas: "Runas", orbitwax: "Orbit Wax" };
const $ = (id) => document.getElementById(id);
let es = null, state = null, ticker = null;

const fmt = (ms) => ms == null ? "" : ms < 1000 ? `${ms} ms` : `${(ms / 1000).toFixed(1)} s`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function fresh() {
  return { release: null, levels: LEVELS.map(([n]) => ({ n, status: "waiting", adapters: {}, stages: {}, ms: null, positions: [], resolved: [] })),
           cells: {}, links: {}, off: {}, finished: null, started: Date.now(), failed: null, lastMs: 0 };
}
const stageOf = (obj, name) => (obj[name] ||= { state: "waiting", counts: "", ms: null });

function counts(e) {
  const d = e.data, s = e.stage;
  if (s === "search") return d.error ? `failed: ${d.error}` : `${d.candidates} candidates`;
  if (s === "match") return `${d.releases} release${d.releases === 1 ? "" : "s"}, ${d.tracks} track${d.tracks === 1 ? "" : "s"}` + (d.rejected ? `, ${d.rejected} rejected` : "");
  if (s === "fetch") return `${d.fetched} fetched, ${d.failed} failed`;
  if (s === "verify") return `${d.accepted} accepted, ${d.rejected} rejected`;
  if (s === "decide") return `${d.found} found, ${d.review} review`;
  return "";
}

function linkFor(e) {
  const key = `${e.position}|${e.level}`;
  const list = (state.links[key] ||= []);
  let l = list.find((x) => x.url === e.data.url);
  if (!l) list.push((l = { url: e.data.url }));
  return l;
}

function apply(e) {
  state.lastMs = Math.max(state.lastMs, e.time);
  const L = e.level != null ? state.levels.find((l) => l.n === e.level) : null;
  if (e.level != null && !L) return;   // a level this page no longer shows (old runs: level 4)
  switch (e.type) {
    case "release_identified": state.release = e.data; break;
    case "level_started":
      L.status = "running"; L.positions = e.data.positions || [];
      for (const a of e.data.adapters || []) L.adapters[a] ||= {};
      break;
    case "level_finished": L.status = Object.keys(L.adapters).length && (L.stages.fetch || Object.values(L.adapters).some(a => a.search && a.search.state !== "waiting")) ? "done" : "skipped";
      L.ms = e.data.ms; L.resolved = e.data.resolved || []; break;
    case "stage_started":
      if (e.adapter) stageOf(L.adapters[e.adapter] ||= {}, e.stage).state = "running";
      else stageOf(L.stages, e.stage).state = "running";
      break;
    case "stage_finished": {
      const st = e.adapter ? stageOf(L.adapters[e.adapter] ||= {}, e.stage) : stageOf(L.stages, e.stage);
      st.state = e.data.error ? "failed" : "done"; st.counts = counts(e); st.ms = e.data.ms; break;
    }
    case "track_resolved": state.cells[`${e.position}|${e.level}`] = { status: e.data.status, source: e.data.source, quality: e.data.quality, confidence: e.data.confidence, url: e.data.url }; break;
    case "candidate_matched": linkFor(e).state ||= "matched"; Object.assign(linkFor(e), { adapter: e.adapter, score: e.data.score, hint: e.data.quality }); break;
    case "candidate_accepted": Object.assign(linkFor(e), { state: "accepted", quality: e.data.quality, adapter: e.adapter }); break;
    case "candidate_rejected": if (e.position) Object.assign(linkFor(e), { state: "rejected", reason: e.data.reason, adapter: e.adapter }); break;
    case "adapter_off": state.off[e.adapter] = e.data.reason; break;
    case "run_finished": state.finished = e.data; break;
    case "run_failed": state.failed = e.data; break;
  }
}

function box(name, a, off) {
  const stages = ["search", "match"].map((s) => stageRow(s, a[s])).join("");
  return `<div class="abox ${off ? "off" : ""}"><div class="an">${esc(name)}${off ? " (off)" : ""}</div>${stages}</div>`;
}
function stageRow(name, st) {
  st ||= { state: "waiting", counts: "", ms: null };
  return `<div class="stage"><span class="st s-${st.state}"><span class="dot"></span>${name}</span><span class="cnt">${esc(st.counts)} ${st.ms != null ? `<span class="s-waiting">${fmt(st.ms)}</span>` : ""}</span></div>`;
}

function linkRow(l) {
  const mark = l.state === "accepted" ? "✓" : l.state === "rejected" ? "✗" : "·";
  const cls = l.state === "accepted" ? "cell-found" : l.state === "rejected" ? "cell-review" : "";
  const href = isUrl(l.url) ? `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.url.replace(/^https?:\/\/(www\.)?/, "").slice(0, 42))}</a>` : esc(l.url);
  return `<small class="${cls}" title="${esc(l.reason || "")}">${mark} ${esc(l.adapter || "")} ${l.score ?? ""} ${href}${l.reason ? ` <span class="alt">${esc(l.reason)}</span>` : ""}</small>`;
}

const isUrl = (u) => /^https?:/.test(u || "");
const link = (u, text) => isUrl(u) ? `<small><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(text || u)}</a></small>` : (u ? `<small>${esc(u)}</small>` : "");

// ---- previews: one play button per track; the source per track comes from the server's plan ----
const player = { run: null, plan: null, pos: null, kind: null, playing: false, audio: new Audio() };
player.audio.onended = () => {   // clips roll on to the next track that has a preview
  const order = (state.release?.tracks || []).map((t) => t.position).filter((p) => player.plan?.tracks[p]);
  const next = order[order.indexOf(player.pos) + 1];
  player.playing = false; buttons();
  if (next) play(next);
};

function buttons() {
  document.querySelectorAll(".play").forEach((b) => {
    const on = b.dataset.pos === player.pos && player.playing;
    b.classList.toggle("on", on); b.textContent = on ? "❚❚" : "▶";
    b.setAttribute("aria-label", `${on ? "Pause" : "Play"} ${b.dataset.pos}`);
  });
  document.querySelectorAll("[data-row]").forEach((r) => r.classList.toggle("now", r.dataset.row === player.pos));
}

function stopAll() {
  player.audio.pause(); player.audio.removeAttribute("src");
  $("dock").innerHTML = ""; $("dock").hidden = true;
  player.pos = null; player.kind = null; player.playing = false;
}

function command(play) {   // YouTube and SoundCloud players take commands by postMessage
  const f = $("dock").querySelector("iframe"); if (!f) return;
  const msg = player.kind === "youtube" ? { event: "command", func: play ? "playVideo" : "pauseVideo", args: [] } : { method: play ? "play" : "pause" };
  f.contentWindow.postMessage(JSON.stringify(msg), "*");
}

function dock(o, pos, html) {
  $("dock").innerHTML = `<div class="dh"><span>${esc(pos)} · ${esc(o.family)}${o.review ? " · review" : ""}</span><button onclick="stopAll(); buttons()" aria-label="Close player">✕</button></div>${html}`;
  $("dock").hidden = false;
}

async function play(pos) {
  const o = player.plan?.tracks[pos]; if (!o) return;
  if (player.pos === pos) {        // same track: pause / resume
    player.playing = !player.playing;
    if (player.kind === "audio" || player.kind === "file") player.playing ? player.audio.play() : player.audio.pause();
    else if (player.kind === "bandcamp") { if (!player.playing) stopAll(); }   // no API: closing stops it
    else command(player.playing);
    return buttons();
  }
  stopAll(); player.pos = pos; player.kind = o.kind; player.playing = true; buttons();
  if (o.kind === "audio" || o.kind === "file") {
    player.audio.src = o.kind === "file" ? `/runs/${player.run}/local/${encodeURIComponent(pos)}` : o.url;
    player.audio.play().catch(() => { player.playing = false; buttons(); });
  } else if (o.kind === "youtube") {
    dock(o, pos, `<iframe height="200" allow="autoplay; encrypted-media" title="YouTube player"
      src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(o.embed_id)}?autoplay=1&enablejsapi=1&rel=0"></iframe>`);
  } else if (o.kind === "soundcloud") {
    dock(o, pos, `<iframe height="20" allow="autoplay" title="SoundCloud player"
      src="https://w.soundcloud.com/player/?url=${encodeURIComponent(o.url)}&auto_play=true&visual=false&show_artwork=false&show_comments=false&hide_related=true&color=%23e5484d"></iframe>`);
  } else if (o.kind === "bandcamp") {
    dock(o, pos, `<span class="s-waiting">loading Bandcamp…</span>`);
    try {
      const r = await fetch(`/embed/bandcamp?url=${encodeURIComponent(o.url)}`); if (!r.ok) throw new Error(await r.text());
      const b = await r.json(); if (player.pos !== pos) return;
      dock(o, pos, `<iframe height="42" title="Bandcamp player"
        src="https://bandcamp.com/EmbeddedPlayer/${b.kind}=${b.id}/size=small/bgcol=141416/linkcol=e5484d/transparent=true/"></iframe>`);
    } catch (e) { if (player.pos === pos) dock(o, pos, `<span class="err">Bandcamp player unavailable. <a href="${esc(o.url)}" target="_blank" rel="noopener noreferrer">Open on Bandcamp</a></span>`); }
  }
}

const FAMILY = { youtube: "YouTube", bandcamp: "Bandcamp", soundcloud: "SoundCloud", itunes: "iTunes", "your files": "Your files" };
const famName = (f) => FAMILY[f] || STORES[f] || f;
const mmss = (s) => s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}` : "";

function renderRecord(r) {
  const rel = state.release; if (!rel) return;
  const pv = r.previews || { tracks: {}, families: [], stores: {} };
  const playable = rel.tracks.filter((t) => pv.tracks[t.position]).length;
  const allStores = {};
  for (const list of Object.values(pv.stores || {})) for (const s of list) allStores[s.source] ||= s.page;
  const facts = [["Label", rel.label], ["Catalogue", rel.catno], ["Year", rel.year], ["Previews", `${playable} of ${rel.tracks.length} tracks`]]
    .filter(([, v]) => v != null && v !== "");
  const rows = rel.tracks.map((t) => {
    const o = pv.tracks[t.position];
    const stores = (pv.stores?.[t.position] || []).map((s) => `<a class="find" href="${esc(s.page)}" target="_blank" rel="noopener noreferrer">Find at ${esc(STORES[s.source] || s.source)} ↗</a>`).join("");
    return `<tr class="${o ? "" : "none"}" data-row="${esc(t.position)}">
      <td style="width:44px">${o ? `<button class="play" data-pos="${esc(t.position)}" aria-label="Play ${esc(t.position)}">▶</button>` : ""}</td>
      <td class="tpos">${esc(t.position)}</td>
      <td class="tname"><b>${esc(t.title)}</b>${t.artist && t.artist !== rel.artist ? `<span>${esc(t.artist)}</span>` : ""}${stores ? `<div>${stores}</div>` : ""}</td>
      <td>${o ? `<span class="src ${o.review ? "rev" : ""}" title="${esc(o.source)} · ${esc(o.quality || "")}">${esc(famName(o.family))}${o.quality && o.quality !== "full" ? ` · ${esc(o.quality)}` : ""}${o.review ? " · review" : ""}</span>` : `<span class="none-src">no preview</span>`}</td>
      <td class="len">${mmss(t.duration)}</td></tr>`;
  }).join("");
  $("record").innerHTML = `
    <nav class="crumbs">Audio research <span>›</span> <b>${esc(rel.title)}</b></nav>
    <header class="head">
      ${rel.cover ? `<div class="cover"><img src="${esc(rel.cover)}" alt="${esc(rel.artist)} - ${esc(rel.title)}"></div>` : `<div class="cover empty" aria-hidden="true"><i></i><i></i><i></i></div>`}
      <div><h1>${esc(rel.title)}</h1><p class="artist">${esc(rel.artist)}${rel.year ? `<span> · ${rel.year}</span>` : ""}</p>
        ${playable < rel.tracks.length ? `<span class="badge">${rel.tracks.length - playable} ${rel.tracks.length - playable === 1 ? "track" : "tracks"} without a preview</span>` : ""}</div>
      <div class="actions">${playable ? `<button class="ghost primary" id="playfirst">▶ Play record</button>` : ""}
        <a class="ghost" href="https://www.discogs.com/release/${esc(rel.release_id)}" target="_blank" rel="noopener noreferrer">Discogs ↗</a></div>
    </header>
    <div class="body">
      <div>
        <div class="tabs"><span>Tracks <em>${rel.tracks.length}</em></span></div>
        <table><tr><th></th><th>Pos</th><th>Title</th><th>Preview</th><th style="text-align:right">Length</th></tr>${rows}</table>
        <p class="hint">Each track plays from the source that covers most of the record; the rest come from the next best one.</p>
      </div>
      <aside aria-label="Attributes"><h2>Attributes</h2>
        <dl>${facts.map(([k, v]) => `<div class="attr"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
        ${pv.families.length ? `<div class="block"><h3>Preview sources</h3>${pv.families.map((f) => `<div class="famrow">${esc(famName(f.family))}<span>${f.tracks.map(esc).join(" ")}</span></div>`).join("")}</div>` : ""}
        ${Object.keys(allStores).length ? `<div class="block"><h3>In record stores</h3><div class="stores">${Object.entries(allStores).map(([s, u]) => `<a class="find" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Find at ${esc(STORES[s] || s)} ↗</a>`).join("")}</div></div>` : ""}
      </aside>
    </div>`;
  $("record").hidden = false;
  $("record").querySelectorAll(".play").forEach((b) => (b.onclick = () => play(b.dataset.pos)));
  const first = rel.tracks.find((t) => pv.tracks[t.position]);
  if (first && $("playfirst")) $("playfirst").onclick = () => play(first.position);
  buttons();
}

async function loadResults(runId) {
  try {
    const r = await (await fetch(`/runs/${runId}`)).json();
    stopAll(); player.run = runId; player.plan = r.previews;
    const titles = Object.fromEntries((state.release?.tracks || []).map((t) => [t.position, t.title]));
    const fams = (r.previews?.families || []).map((f) => `<b>${esc(f.family)}</b> ${f.tracks.length} (${f.tracks.map(esc).join(" ")})`).join(" · ");
    let h = `<div class="fam">Previews: ${fams || "nothing playable found"}</div><table><tr><th>Pos</th><th>Title</th><th>Status</th><th>Link</th><th>Source</th><th>Quality</th><th>Conf.</th><th>Why</th></tr>`;
    for (const t of r.tracks) {
      const alts = (t.alternatives || []).map((a) => `<span class="alt">also: ${esc(a.source)} ${esc(a.quality)} ${a.confidence} ${isUrl(a.url) ? `<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">link</a>` : ""}</span>`).join("");
      h += `<tr><td class="pos">${esc(t.position)}</td><td class="ttl">${esc(titles[t.position])}</td><td class="cell-${t.status === "not_found" ? "notfound" : t.status}">${t.status}</td>
        <td class="lnk">${(r.previews?.stores[t.position] || []).map((s) => `<a class="find" href="${esc(s.page)}" target="_blank" rel="noopener noreferrer">Find at ${esc(STORES[s.source] || s.source)} ↗</a>`).join("")}${isUrl(t.url) ? `<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${esc(t.url)}</a>` : esc(t.url || "")}${alts}</td>
        <td>${esc(t.source || "")}</td><td>${esc(t.quality || "")}</td><td>${t.source ? t.confidence : ""}</td><td>${esc(t.reason)}</td></tr>`;
    }
    $("results").innerHTML = h + "</table>";
    renderRecord(r);
  } catch (e) { $("results").textContent = "No result available."; }
}

function render() {
  const s = state;
  if (s.release) {
    const r = s.release;
    $("release").innerHTML = `<b>${esc(r.artist)} — ${esc(r.title)}</b><div class="meta">${esc(r.label || "")} ${esc(r.catno || "")} · ${r.year || "?"} · ${r.track_count} tracks · identified in ${fmt(r.ms)}</div>`;
  }
  $("levels").innerHTML = s.levels.map((L) => {
    const names = Object.keys(L.adapters);
    const boxes = names.map((n) => box(n, L.adapters[n], n in s.off)).join("");
    const shared = ["fetch", "verify", "decide"].map((x) => stageRow(x, L.stages[x])).join("");
    const meta = LEVELS.find(([n]) => n === L.n);
    return `<div class="level ${L.status}"><div class="lname"><b>${L.n} · ${meta[1]}</b><span class="s-${L.status === "done" ? "done" : L.status}"><span class="dot"></span>${L.status}</span></div>
      <div class="boxes">${boxes}${L.stages.fetch || L.status === "running" ? `<div class="abox"><div class="an">fetch · verify · decide</div>${shared}</div>` : ""}${!names.length && L.status === "waiting" ? '<span class="s-waiting">waiting</span>' : ""}</div>
      <div class="lms">${fmt(L.ms)}</div></div>`;
  }).join("");

  if (s.release) {
    let h = "<table><tr><th>Pos</th><th>Title</th>" + LEVELS.map(([n]) => `<th>L${n}</th>`).join("") + "</tr>";
    for (const t of s.release.tracks) {
      h += `<tr><td class="pos">${esc(t.position)}</td><td class="ttl">${esc(t.title)}</td>`;
      for (const L of s.levels) {
        const c = s.cells[`${t.position}|${L.n}`];
        const links = (s.links[`${t.position}|${L.n}`] || []).map(linkRow).join("");
        if (c) h += `<td class="cell cell-${c.status}">${c.status}<small>${esc(c.source)} · ${esc(c.quality)} · ${c.confidence}</small>${links}</td>`;
        else if (L.status !== "skipped" && L.positions.includes(t.position) && L.status === "done") h += `<td class="cell cell-notfound">${links ? "links found, none kept" : "not found"}${links}</td>`;
        else if (L.status !== "skipped" && L.positions.includes(t.position)) h += `<td class="cell cell-notfound">…${links}</td>`;
        else h += '<td class="cell cell-no">not tried</td>';
      }
      h += "</tr>";
    }
    $("grid").innerHTML = h + "</table>";
  }

  if (s.failed) $("summary").innerHTML = `<div class="err">Run failed: ${esc(s.failed.error)}\n${esc(s.failed.trace || "")}</div>`;
  else if (s.finished) {
    const f = s.finished;
    const per = s.levels.filter((L) => L.ms != null).map((L) => `L${L.n} ${fmt(L.ms)}`).join(" · ");
    const off = Object.keys(s.off).length ? Object.keys(s.off).join(", ") : "none";
    $("summary").innerHTML = `<div class="summary"><div><b class="cell-found">${f.found}</b><span>found</span></div><div><b class="cell-review">${f.review}</b><span>review</span></div>
      <div><b>${f.not_found}</b><span>not found</span></div><div><b>${fmt(f.ms)}</b><span>total${f.cached ? " (cached)" : ""}</span></div></div>
      <div class="meta" style="margin-top:8px">${esc(per)} · adapters switched off: ${esc(off)}</div>`;
  }
  $("total").textContent = fmt(s.finished || s.failed ? s.lastMs : Date.now() - s.started);
}

function log(e) {
  const d = document.createElement("div");
  const cls = e.type === "candidate_rejected" ? "rej" : e.type === "track_resolved" ? "res" : e.type === "adapter_off" ? "off" : "";
  if (cls) d.className = cls;
  const tags = [e.level != null ? `L${e.level}` : "", e.adapter || "", e.stage || "", e.position || ""].filter(Boolean).join(" ");
  const data = Object.entries(e.data || {}).filter(([k]) => !["tracks", "trace", "positions"].includes(k)).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join(" ");
  d.innerHTML = `<span class="t">+${e.time}ms</span> ${esc(e.type)} <span style="color:var(--dim)">${esc(tags)}</span> ${esc(data)}`;
  const box = $("log"), stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  box.appendChild(d);
  if (stick) box.scrollTop = box.scrollHeight;
}

function watch(runId) {
  if (es) es.close();
  clearInterval(ticker);
  state = fresh(); $("log").innerHTML = ""; $("summary").textContent = "Shown when the run finishes."; $("results").textContent = "Shown when the run finishes.";
  $("release").textContent = "Starting…"; $("record").hidden = true; stopAll();
  es = new EventSource(`/runs/${runId}/events`);
  let queued = false;
  es.addEventListener("run", (m) => {
    const e = JSON.parse(m.data);
    apply(e); log(e);
    if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; render(); }); }
    if (e.type === "run_finished" || e.type === "run_failed") { es.close(); clearInterval(ticker); render(); loadPast(runId); loadResults(runId); }
  });
  es.onerror = () => { if (es.readyState === EventSource.CLOSED) clearInterval(ticker); };
  ticker = setInterval(() => { if (!state.finished && !state.failed) render(); }, 200);
  render();
}

async function loadPast(select) {
  const runs = await (await fetch("/runs")).json();
  $("past").innerHTML = '<option value="">Past runs…</option>' + runs.map((r) =>
    `<option value="${r.run_id}" ${r.run_id === select ? "selected" : ""}>${esc(r.title || r.url)} — ${esc(r.started_at || "")}</option>`).join("");
}

$("start").onclick = async () => {
  const url = $("url").value.trim(); if (!url) return;
  $("start").disabled = true;
  try {
    const r = await fetch("/runs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url, search_all: $("searchall").checked }) });
    watch((await r.json()).run_id);
  } finally { $("start").disabled = false; }
};
$("url").onkeydown = (e) => { if (e.key === "Enter") $("start").click(); };
$("past").onchange = (e) => { if (e.target.value) watch(e.target.value); };
state = fresh(); render();
// open on the latest run, so the record and its previews show without picking one
loadPast().then(() => { const latest = $("past").options[1]?.value; if (latest) { $("past").value = latest; watch(latest); } });
</script>
</body>
</html>
